<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Read the Bhagavad Gita one verse at a time: Sanskrit, translation and short takes in English, Hindi, French, Spanish and Arabic.">
<title>Gita4U · Bhagwat Gita</title>
<meta name="theme-color" content="#0d1027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gita4U">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gotu&family=Mukta:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: full-screen vertical card feed (swipe up = next verse); each verse card is a sideways pager of panels. Single dark "night at Kurukshetra" look. */
:root{
  --night:#0d1027; --surface:#171b3d; --surface-2:#20265a; --ink:#f3efe6; --muted:#a7abc9;
  --marigold:#f3a93b; --peacock:#2fb3a6; --pink:#ff7ab6; --line:rgba(243,239,230,.14);
  --accent:var(--marigold);
  --f-display:"Gotu","Mukta",system-ui,sans-serif;
  --f-body:"Mukta",system-ui,sans-serif;
  --f-shloka:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif;
  color-scheme:dark;
}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
html[lang="hi"] .ch-num,html[lang="hi"] .vtag,html[lang="hi"] .label,html[lang="hi"] .chap-btn small,html[lang="ar"] .ch-num,html[lang="ar"] .label,html[lang="ar"] .chap-btn small,html[lang="ar"] .l-meta{letter-spacing:0;text-transform:none}
html[lang="ar"]{--f-display:"Noto Naskh Arabic","Mukta",system-ui,sans-serif;--f-body:"Noto Naskh Arabic","Mukta",system-ui,sans-serif}
/* Arabic reads right to left, but the sideways pager keeps left-to-right scrolling so swipe maths stay simple. */
[dir="rtl"] .pager{direction:ltr}[dir="rtl"] .panel .inner{direction:rtl}
[dir="rtl"] .shloka,[dir="rtl"] .translit{direction:ltr;text-align:right}
[dir="rtl"] .panel .inner{padding-right:max(20px,env(safe-area-inset-right,0px));padding-left:max(72px,env(safe-area-inset-left,0px))}
[dir="rtl"] .rail{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
[dir="rtl"] .q span{transform:scaleX(-1)}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--night),rgba(13,16,39,0))}
.chap-btn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;text-align:left}
.chap-btn small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.chap-btn span{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lang-btn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(23,27,61,.8);font-size:13px;font-weight:700}
.lang-btn svg{width:15px;height:15px;color:var(--muted)}
.lang-list{display:grid;gap:8px}
.lang-list button{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:17px}
.lang-list button small{color:var(--muted);font-size:13px}
.lang-list button[aria-current="true"]{outline:1px solid var(--accent)}

.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;
  display:flex;flex-direction:column}
.card .bg{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 70% at 50% 108%,color-mix(in srgb,var(--hue) 55%,transparent),transparent 70%),
  radial-gradient(60% 40% at 85% 10%,rgba(243,169,59,.10),transparent 70%),var(--night)}
.inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:76px max(20px,env(safe-area-inset-right,0px)) 96px max(20px,env(safe-area-inset-left,0px));max-width:620px;margin:0 auto;width:100%}

/* chapter opener */
.ch-num{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.ch-sa{font-family:var(--f-shloka);font-size:clamp(34px,10vw,52px);line-height:1.15;text-wrap:balance}
.ch-en{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.summary{line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.tldr{border:1px dashed var(--pink);border-radius:14px;padding:12px 14px;line-height:1.55}
.tldr b{display:block;font-size:11px;letter-spacing:.14em;color:var(--pink);margin-bottom:4px}
.hint{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.link{color:var(--accent);font-weight:600;align-self:flex-start;padding:2px 0}

/* verse pager */
.pager{position:relative;z-index:1;flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;scroll-snap-align:start;display:flex;min-width:0}
.panel .inner{justify-content:flex-start;overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent 100px,#000 124px);mask-image:linear-gradient(transparent 100px,#000 124px)}
.panel .inner::-webkit-scrollbar{display:none}
.panel .inner>*{flex-shrink:0}
.panel .inner>:first-child{margin-top:auto}
.panel .inner>:last-child{margin-bottom:auto}
.panel .inner{padding-top:124px;padding-right:max(72px,env(safe-area-inset-right,0px))}
.vhead{position:absolute;z-index:2;top:62px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));max-width:620px;margin:0 auto}
.vnum{font-family:var(--f-display);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:rgba(23,27,61,.85);border:1px solid var(--line);border-radius:999px;padding:2px}
.tabs button{font-size:13px;padding:4px 10px;border-radius:999px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--night);font-weight:700}
.en-tr{font-family:var(--f-display);font-size:17px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
.shorts-panel .shorts-text{font-family:var(--f-display);font-size:clamp(22px,6vw,28px);line-height:1.45}
.vtag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.shloka{font-family:var(--f-shloka);font-size:clamp(20px,5.6vw,28px);line-height:1.7;white-space:pre-line;text-wrap:balance}
.translit{font-style:italic;color:var(--muted);line-height:1.6;white-space:pre-line}
.meaning{font-family:var(--f-display);font-size:clamp(19px,5.2vw,24px);line-height:1.55}
.body-text{font-size:17px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:12;-webkit-box-orient:vertical;overflow:hidden}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ask-also{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ask-also .label{color:var(--pink)}
.q{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(23,27,61,.7);font-size:15px;line-height:1.4}
.q span{color:var(--pink);font-size:20px}
.genz-text{font-family:var(--f-display);font-size:clamp(20px,5.6vw,26px);line-height:1.5}
.sticker{align-self:flex-start;background:var(--pink);color:var(--night);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;transform:rotate(-3deg)}
.dots{position:absolute;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.dots i.on{width:18px;background:var(--accent)}
.dots-labels{position:absolute;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 42px);text-align:center;font-size:12px;color:var(--muted)}

.rail{position:absolute;z-index:3;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 80px);display:flex;flex-direction:column;gap:16px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.rail .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(32,38,90,.85);border:1px solid var(--line);color:var(--ink)}
.rail button.on .ic{background:var(--accent);color:var(--night)}
.rail svg{width:22px;height:22px}

/* ad + end cards */
.ad .inner{align-items:center;text-align:center}
.ad-slot{position:relative;width:100%;max-width:340px;aspect-ratio:4/5;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.ad-brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px}
.ad-brand .om{font-family:var(--f-shloka);font-size:64px;line-height:1;color:var(--accent)}
.ad-brand .b-sa{font-family:var(--f-shloka);font-size:28px;margin-top:10px}
.ad-brand .b-en{font-family:var(--f-display);font-size:22px}
.ad-brand .b-tag{color:var(--muted);margin-top:6px}
.ad-slot .adsbygoogle{position:relative;z-index:1;width:100%;height:100%}
.ad-slot .adsbygoogle[data-ad-status="filled"]{background:var(--surface)}
.ad-slot .adsbygoogle[data-ad-status="unfilled"]{display:none!important}
.big-btn{background:var(--accent);color:var(--night);font-weight:700;padding:12px 22px;border-radius:999px;align-self:flex-start}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,6,18,.6)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:18px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;position:sticky;top:-18px;background:var(--surface);padding-top:4px}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0;font-weight:400}
.sheet p{line-height:1.7;max-width:65ch;white-space:pre-line}
.links{display:flex;gap:20px;flex-wrap:wrap}
.faq{margin:0;max-width:65ch}.faq dt{font-family:var(--f-display);font-size:18px;line-height:1.4;margin-top:18px}.faq dt:first-child{margin-top:0}.faq dd{margin:6px 0 0;line-height:1.65;color:var(--ink)}
.close{font-size:14px;color:var(--accent);font-weight:600}
.ch-list{display:grid;gap:8px}
.ch-list button{display:flex;gap:14px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.ch-list .n{font-family:var(--f-display);color:var(--accent);width:24px;font-variant-numeric:tabular-nums}
.ch-list .t{display:flex;flex-direction:column;min-width:0}
.ch-list .t small{color:var(--muted)}
.ch-list button[aria-current="true"]{outline:1px solid var(--accent)}

.ask-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent);color:var(--night);font-weight:700;font-size:13px}
.ask-btn svg{width:16px;height:16px}
.sheet.ask{height:82%;overflow:hidden;display:flex;flex-direction:column}
.ask .sheet-head{position:static}
.ask-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.msg{max-width:92%;line-height:1.6;padding:10px 14px;border-radius:16px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--surface-2)}
.msg.gita{align-self:flex-start;background:rgba(243,169,59,.08);border:1px solid var(--line)}
.msg.wait{color:var(--muted)}
.msg.err{border-color:#e05a5a;color:var(--ink)}
.cite{color:var(--accent);font-weight:700;padding:0 2px;text-decoration:underline;text-underline-offset:3px}
.intro{color:var(--muted);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;text-align:left}
.ask-form{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.ask-form input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit}
.ask-form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ask-form button:disabled{opacity:.5}
.ask-status{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--muted);margin:-4px 0 10px}
.ask-status button{color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.ask-gate{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ask-gate h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.ask-gate p{margin:0;line-height:1.6;color:var(--muted)}
.ask-gate form{display:flex;gap:8px}
.ask-gate input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit}
.ask-gate input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ask-gate input.code{letter-spacing:.3em;font-variant-numeric:tabular-nums}
.ask-gate .link{align-self:flex-start;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.ask-gate .err{color:#ff8a7a;font-size:14px}
.ask-gate button:disabled{opacity:.5}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--night);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}

/* landing: the Gita as a rolled scroll; tapping unrolls it and opens Chapter 1 */
.landing{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:22px;text-align:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:radial-gradient(90% 60% at 50% 100%,rgba(196,83,45,.35),transparent 70%),radial-gradient(70% 45% at 50% 0%,rgba(243,169,59,.12),transparent 70%),var(--night);
  transition:opacity .5s ease,visibility .5s}
.landing.gone{opacity:0;visibility:hidden}
.scroll{display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.roll{position:relative;z-index:2;width:min(280px,78vw);height:30px;border-radius:15px;
  background:linear-gradient(#5b3313,#b97a35 35%,#e2b062 50%,#b97a35 65%,#5b3313)}
.roll::before,.roll::after{content:"";position:absolute;top:-5px;width:16px;height:40px;border-radius:8px;background:linear-gradient(#7d4a17,#f3a93b 50%,#7d4a17)}
.roll::before{left:-12px}.roll::after{right:-12px}
.paper{position:relative;width:min(244px,68vw);height:28px;overflow:hidden;margin:-6px 0;
  background:linear-gradient(90deg,#d9c08c,#f5e6c4 12%,#fbf1da 50%,#f5e6c4 88%,#d9c08c);color:#5a1d12;
  transition:height 1s cubic-bezier(.6,.05,.3,1)}
.paper-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px 18px;opacity:0;transition:opacity .4s .55s}
.paper .om{font-family:var(--f-shloka);font-size:56px;line-height:1;color:#b4471f}
.paper .p-sa{font-family:var(--f-shloka);font-size:26px;line-height:1.3}
.paper .p-sh{font-family:var(--f-shloka);font-size:15px;line-height:1.7;margin-top:6px;opacity:.85}
.tie{position:absolute;z-index:3;left:50%;top:50%;width:26px;height:74px;transform:translate(-50%,-50%);border-radius:4px;
  background:linear-gradient(90deg,#8e1b1b,#d33b2c 50%,#8e1b1b);box-shadow:0 2px 6px rgba(0,0,0,.4);transition:opacity .3s}
.roll,.paper,.scroll-wrap,.paper-in>span{display:block}
.scroll-wrap{position:relative}
.paper-in{display:flex}
.scroll.open .paper{height:min(300px,40vh)}
.scroll.open .paper-in{opacity:1}
.scroll.open .tie{opacity:0}
.l-title{font-family:var(--f-display);font-size:clamp(44px,13vw,64px);line-height:1;letter-spacing:-.01em}
.l-title b{color:var(--accent);font-weight:inherit}
.l-sa{font-family:var(--f-shloka);font-size:22px;line-height:1.3;color:var(--muted);margin-top:8px}
.l-what{display:grid;gap:10px;width:min(420px,100%);text-align:start}
.l-what div{display:flex;gap:10px;align-items:baseline;line-height:1.5;font-size:15px}
.l-what b{flex:none;min-width:58px;color:var(--accent);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.l-note{max-width:420px;margin:0;color:var(--muted);font-size:12.5px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
.l-langs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:12px;display:flex;gap:4px}
.l-langs button{padding:4px 9px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid transparent}
.l-langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--line)}
.landing.opening .l-what,.landing.opening .l-note,.landing.opening .l-langs{opacity:0;transition:opacity .3s}
.l-meta{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:10px}
.l-cta{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.l-cta svg{animation:bob 1.6s ease-in-out infinite}
.landing.opening .l-cta{opacity:0}
@media (prefers-reduced-motion:reduce){.paper,.paper-in,.tie,.landing{transition:none}.l-cta svg{animation:none}.hint svg{animation:none}.dots i{transition:none}}
</style>
</head>
<body>

<div class="landing" id="landing" hidden>
  <div class="l-langs" id="landLangs" role="group" aria-label="Language"></div>
  <div>
    <h1 class="l-title" style="margin:0">Gita<b>4U</b></h1>
    <div class="l-sa">श्रीमद्भगवद्गीता</div>
    <div class="l-meta" id="landMeta">18 chapters · 700 verses</div>
  </div>
  <button class="scroll" id="scroll" aria-label="Open the Bhagwat Gita at Chapter 1">
    <span class="roll"></span>
    <span class="scroll-wrap"><span class="paper"><span class="paper-in">
      <span class="om">ॐ</span>
      <span class="p-sa">श्रीमद्भगवद्गीता</span>
      <span class="p-sh">धर्मक्षेत्रे कुरुक्षेत्रे<br>समवेता युयुत्सवः ।</span>
    </span></span><span class="tie"></span></span>
    <span class="roll"></span>
  </button>
  <div class="l-cta" id="landCta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>Tap the scroll to begin</span></div>
  <div class="l-what">
    <div><b id="landVerseH">Verse</b><span id="landVerse"></span></div>
    <div><b id="landShortsH">Shorts</b><span id="landShorts"></span></div>
  </div>
  <p class="l-note" id="landNote"></p>
</div>
<header class="top">
  <button class="chap-btn" id="chapBtn" aria-label="Choose chapter"><small id="chapNo">Chapter 1</small><span id="chapName">Arjuna Vishada Yoga</span></button>
  <button class="ask-btn" id="askBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span id="askBtnLabel">Ask</span></button>
  <button class="lang-btn" id="langBtn" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="langLabel">EN</span></button>
</header>
<main class="feed" id="feed"><div class="loading">Loading…</div></main>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose">Close</button></div>
  <div id="sheetBody"></div>
</section>
<section class="sheet ask" id="ask" hidden aria-modal="true" role="dialog" aria-labelledby="askTitle">
  <div class="sheet-head"><h2 id="askTitle">Ask Gita</h2><button class="close" id="askClose">Close</button></div>
  <div class="ask-status" id="askStatus" hidden></div>
  <div class="ask-log" id="askLog" aria-live="polite"></div>
  <div class="ask-gate" id="askGate" hidden></div>
  <form class="ask-form" id="askForm"><input id="askInput" maxlength="600" autocomplete="off" aria-label="Your question"><button class="big-btn" id="askSend" type="submit">Ask</button></form>
</section>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="genz.js"></script>
<script>
window.addEventListener('error',e=>{const f=document.getElementById('feed');if(f&&!f.querySelector('.card'))f.innerHTML='<div class="loading">Something went wrong loading the page: '+String(e.message).replace(/</g,'&lt;')+'</div>'});
const $=s=>document.querySelector(s);
const HUES=['#4b3bb0','#c4532d','#2fb3a6','#b8892d','#3a6fd8','#8f3fa8','#2f8f5a','#c2410c','#4f46e5','#b45309','#0e7490','#be185d','#65a30d','#7c3aed','#0891b2','#dc2626','#ca8a04','#f3a93b'];
const AD_EVERY=8;
const T={
  en:{chapter:'Chapter',verses:'verses',swipe:'Swipe up to begin',shorts:'Shorts',sVerse:'Verse',share:'Share',save:'Save',next:'Next chapter',end:'End of chapter',copied:'Verse copied. Paste it anywhere to share.',sideways:'Swipe sideways for Shorts',faq:'FAQ',alsoAsk:'People also ask',brandTag:'One verse at a time',chooseCh:'Choose a chapter',lang:'Language',tap:'Tap the scroll to begin',meta:'18 chapters · 700 verses',loadErr:'Could not load this chapter. Check your connection and reopen the page.',landVerse:'The exact meaning: Sanskrit, transliteration and a faithful translation of every verse.',landShorts:'A GenZ take: each verse retold in a few lines for life today, with FAQs.',landNote:'Our only intention is to explain the Bhagavad Gita and its meaning in simple words. Shorts are a modern retelling, not scripture. Nothing here is meant to hurt anyone\'s faith or sentiments.'},
  hi:{chapter:'अध्याय',verses:'श्लोक',swipe:'शुरू करने के लिए ऊपर स्वाइप करें',shorts:'Shorts',sVerse:'श्लोक',share:'शेयर',save:'सेव',next:'अगला अध्याय',end:'अध्याय समाप्त',copied:'श्लोक कॉपी हो गया। कहीं भी पेस्ट करके शेयर करें।',sideways:'Shorts के लिए बगल में स्वाइप करें',faq:'सवाल-जवाब',alsoAsk:'लोग यह भी पूछते हैं',brandTag:'हर दिन एक श्लोक',chooseCh:'अध्याय चुनें',lang:'भाषा',tap:'शुरू करने के लिए ग्रंथ पर टैप करें',meta:'18 अध्याय · 700 श्लोक',loadErr:'यह अध्याय लोड नहीं हो पाया। कनेक्शन देखें और पेज फिर से खोलें।',landVerse:'सटीक अर्थ: हर श्लोक का संस्कृत पाठ, उच्चारण और सही अनुवाद।',landShorts:'GenZ अंदाज़: हर श्लोक आज की ज़िंदगी के लिए कुछ पंक्तियों में, साथ में सवाल-जवाब।',landNote:'हमारा उद्देश्य केवल भगवद्गीता और उसके अर्थ को सरल शब्दों में समझाना है। Shorts आज की भाषा में कही गई बात हैं, स्वयं शास्त्र नहीं। यहाँ कुछ भी किसी की आस्था या भावनाओं को ठेस पहुँचाने के लिए नहीं है।'},
  fr:{chapter:'Chapitre',verses:'versets',swipe:'Glisse vers le haut pour commencer',sVerse:'Verset',shorts:'Shorts',share:'Partager',save:'Enregistrer',next:'Chapitre suivant',end:'Fin du chapitre',copied:'Verset copié. Colle-le où tu veux pour le partager.',sideways:'Glisse sur le côté pour les Shorts',faq:'FAQ',alsoAsk:'Les gens demandent aussi',brandTag:'Un verset à la fois',chooseCh:'Choisis un chapitre',lang:'Langue',tap:'Touche le rouleau pour commencer',meta:'18 chapitres · 700 versets',loadErr:'Impossible de charger ce chapitre. Vérifie ta connexion et rouvre la page.',landVerse:'Le sens exact : le sanskrit, la translittération et une traduction fidèle de chaque verset.',landShorts:'La version GenZ : chaque verset raconté en quelques lignes pour la vie d\'aujourd\'hui, avec une FAQ.',landNote:'Notre seule intention est d\'expliquer la Bhagavad Gita et son sens avec des mots simples. Les Shorts sont une relecture moderne, pas le texte sacré. Rien ici ne vise à blesser la foi ou les sentiments de quiconque.'},
  es:{chapter:'Capítulo',verses:'versos',swipe:'Desliza hacia arriba para empezar',sVerse:'Verso',shorts:'Shorts',share:'Compartir',save:'Guardar',next:'Capítulo siguiente',end:'Fin del capítulo',copied:'Verso copiado. Pégalo donde quieras para compartirlo.',sideways:'Desliza hacia el lado para ver los Shorts',faq:'FAQ',alsoAsk:'La gente también pregunta',brandTag:'Un verso a la vez',chooseCh:'Elige un capítulo',lang:'Idioma',tap:'Toca el pergamino para empezar',meta:'18 capítulos · 700 versos',loadErr:'No se pudo cargar este capítulo. Revisa tu conexión y vuelve a abrir la página.',landVerse:'El significado exacto: el sánscrito, la transliteración y una traducción fiel de cada verso.',landShorts:'La versión GenZ: cada verso contado en pocas líneas para la vida de hoy, con preguntas frecuentes.',landNote:'Nuestra única intención es explicar el Bhagavad Gita y su significado con palabras sencillas. Los Shorts son una relectura moderna, no el texto sagrado. Nada aquí pretende herir la fe ni los sentimientos de nadie.'},
  ar:{chapter:'الفصل',verses:'آية',swipe:'اسحب للأعلى لتبدأ',sVerse:'الآية',shorts:'Shorts',share:'مشاركة',save:'حفظ',next:'الفصل التالي',end:'نهاية الفصل',copied:'تم نسخ الآية. الصقها في أي مكان لمشاركتها.',sideways:'اسحب جانبًا لترى الـShorts',faq:'أسئلة شائعة',alsoAsk:'يسأل الناس أيضًا',brandTag:'آية واحدة في كل مرة',chooseCh:'اختر فصلًا',lang:'اللغة',tap:'المس اللفافة لتبدأ',meta:'18 فصلًا · 700 آية',loadErr:'تعذّر تحميل هذا الفصل. تحقّق من اتصالك وأعد فتح الصفحة.',landVerse:'المعنى الدقيق: النص السنسكريتي ونطقه وترجمة أمينة لكل آية.',landShorts:'بأسلوب الجيل Z: كل آية في سطور قليلة لحياة اليوم، مع أسئلة شائعة.',landNote:'نيتنا الوحيدة هي شرح البهاغافاد غيتا ومعناها بكلمات بسيطة. الـShorts إعادة صياغة عصرية وليست النص المقدس نفسه. لا شيء هنا يقصد الإساءة إلى إيمان أحد أو مشاعره.'}
};
const LANGS=[['en','English','EN'],['hi','हिन्दी','हिं'],['fr','Français','FR'],['es','Español','ES'],['ar','العربية','ع']];
const BASE=['en','hi'];
const S={lang:'en',panel:0,ch:1,chapters:null,cache:{},xcache:{},xch:{},saved:new Set()};
try{const p=JSON.parse(localStorage.getItem('gita-prefs')||'{}');if(T[p.lang])S.lang=p.lang;if(p.panel)S.panel=Math.min(+p.panel||0,1);(p.saved||[]).forEach(x=>S.saved.add(x))}catch(e){}
function persist(){try{localStorage.setItem('gita-prefs',JSON.stringify({lang:S.lang,panel:S.panel,saved:[...S.saved]}))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=k=>T[S.lang][k]??T.en[k];
const ICON={
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 up:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
};

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()}
async function loadChapter(n){
  if(!S.cache[n])S.cache[n]=await getJSON('data/ch'+n+'.json');
  // French, Spanish and Arabic text lives in data/<lang>/, one file per chapter, in verse order.
  if(!BASE.includes(S.lang)){
    const k=S.lang+':'+n;
    if(!S.xcache[k])S.xcache[k]=await getJSON(`data/${S.lang}/ch${n}.json`);
    if(!S.xch[S.lang])S.xch[S.lang]=await getJSON(`data/${S.lang}/chapters.json`);
  }
  return S.cache[n];
}
// The current language's translation, Short and FAQs for a verse, and the chapter-level text.
function vx(c,v){
  if(BASE.includes(S.lang))return{tr:v[S.lang],short:(window.GENZ[c.n+'.'+v.v]||{})[S.lang],faq:v.faq?v.faq[S.lang]:[]};
  const x=(S.xcache[S.lang+':'+c.n]||[])[v.v-1];
  // A verse not yet translated shows the English text rather than an empty card.
  return x&&x.tr?x:{tr:v.en,short:(window.GENZ[c.n+'.'+v.v]||{}).en,faq:v.faq?v.faq.en:[]};
}
function cx(c){
  if(BASE.includes(S.lang))return{name:S.lang==='hi'?c.sa:c.en,mean:c.mean,tldr:(window.GENZ_CH[c.n]||{})[S.lang],faq:c.faq?c.faq[S.lang]:[]};
  const x=(S.xch[S.lang]||[])[c.n-1]||{};
  return{name:S.lang==='ar'?x.mean:c.en,...x};
}

function chapterCard(c){
  const x=cx(c);
  return `<article class="card" style="--hue:${HUES[c.n-1]}"><div class="bg"></div><div class="inner">
    <div class="ch-num">${t('chapter')} ${c.n} · ${c.count} ${t('verses')}</div>
    <div class="ch-sa">${esc(c.sa)}</div>
    <div class="ch-en">${S.lang==='ar'?esc(x.mean):`${esc(c.en)} · ${esc(x.mean)}`}</div>
    ${x.tldr?`<div class="tldr"><b>${t('shorts')}</b>${esc(x.tldr)}</div>`:''}
    ${x.faq&&x.faq.length?`<button class="link" data-act="faq">${t('faq')}</button>`:''}
    <div class="hint">${ICON.up}${t('swipe')}</div>
  </div></article>`;
}
const PANELS=['verse','shorts'];
function verseCard(c,v){
  const key=c.n+'.'+v.v, x=vx(c,v), faq=x.faq||[];
  const html={
    verse:`<div class="shloka">${esc(v.sa)}</div><div class="translit">${esc(v.tl)}</div><div class="en-tr">${esc(x.tr)}</div>`,
    shorts:`<span class="sticker">${t('shorts')}</span><div class="shorts-text">${esc(x.short)}</div>
      ${faq.length?`<div class="ask-also"><div class="label">${t('alsoAsk')}</div>${faq.map((x,i)=>`<button class="q" data-act="faq" data-q="${i}">${esc(x.q)}<span aria-hidden="true">›</span></button>`).join('')}</div>`:''}`
  };
  const saved=S.saved.has(key);
  return `<article class="card verse" data-key="${key}" data-v="${v.v}" style="--hue:${HUES[c.n-1]}"><div class="bg"></div>
    <div class="vhead"><div class="vnum">${key}</div><div class="tabs" role="tablist">${PANELS.map((k,i)=>`<button role="tab" data-tab="${i}" aria-selected="${i===S.panel}">${t(['sVerse','shorts'][i])}</button>`).join('')}</div></div>
    <div class="pager">${PANELS.map(k=>`<section class="panel ${k}-panel" data-panel="${k}"><div class="inner">${html[k]}</div></section>`).join('')}</div>
    <div class="rail">
      <button data-act="share"><span class="ic">${ICON.share}</span><span>${t('share')}</span></button>
      <button data-act="save" class="${saved?'on':''}" aria-pressed="${saved}"><span class="ic">${ICON.save}</span><span>${t('save')}</span></button>
    </div></article>`;
}
// In-feed card: the Bhagwat Gita card, with an AdSense unit on top of it once AdSense is set up and an ad fills.
const CFG=window.GITA_CONFIG||{}, ADS=!!(CFG.adsenseClient&&CFG.adsenseSlot);
function adCard(c){return `<article class="card ad" style="--hue:${HUES[c.n-1]}"><div class="bg"></div><div class="inner"><div class="ad-slot">
  <div class="ad-brand"><div class="om">ॐ</div><div class="b-sa">श्रीमद्भगवद्गीता</div><div class="b-en">Bhagwat Gita</div><div class="b-tag">${t('brandTag')}</div></div>
  ${ADS?`<ins class="adsbygoogle" style="display:block" data-ad-client="${esc(CFG.adsenseClient)}" data-ad-slot="${esc(CFG.adsenseSlot)}" data-ad-format="auto" data-full-width-responsive="true"></ins>`:''}
</div></div></article>`}
let adsLoaded=false;
function fillAds(root){
  if(!ADS)return;
  if(!adsLoaded){adsLoaded=true;const s=document.createElement('script');s.async=true;s.crossOrigin='anonymous';s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+encodeURIComponent(CFG.adsenseClient);document.head.appendChild(s)}
  root.querySelectorAll('ins.adsbygoogle:not([data-adsbygoogle-status])').forEach(()=>{try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}});
}
function endCard(c){
  const nx=c.n<18?S.chapters[c.n]:null;
  return `<article class="card" style="--hue:${HUES[c.n-1]}"><div class="bg"></div><div class="inner">
    <div class="ch-num">${t('end')} ${c.n}</div>
    ${nx?`<div class="ch-sa">${esc(nx.sa)}</div><div class="ch-en">${esc(cx(nx).name)}</div><button class="big-btn" data-act="next">${t('next')} ${S.lang==='ar'?'←':'→'}</button>`:`<div class="ch-sa">ॐ तत् सत्</div>`}
  </div></article>`;
}

async function render(scrollToVerse){
  const c=S.chapters[S.ch-1];
  const feed=$('#feed');
  let verses;
  try{verses=await loadChapter(c.n)}catch(e){feed.innerHTML=`<div class="loading">${esc(t('loadErr'))}</div>`;return}
  $('#chapNo').textContent=`${t('chapter')} ${c.n}`;
  $('#chapName').textContent=cx(c).name;
  let h=chapterCard(c);
  verses.forEach((v,i)=>{h+=verseCard(c,v);if((i+1)%AD_EVERY===0&&i<verses.length-1)h+=adCard(c)});
  h+=endCard(c);
  feed.innerHTML=h;
  fillAds(feed);
  syncPagers(null);
  feed.querySelectorAll('.pager').forEach(p=>{let pt;p.addEventListener('scroll',()=>{
    if(p._sync)return;
    const i=Math.round(p.scrollLeft/p.clientWidth);
    p.parentElement.querySelectorAll('.tabs button').forEach((d,j)=>d.setAttribute('aria-selected',i===j));
    clearTimeout(pt);pt=setTimeout(()=>{if(i!==S.panel){S.panel=i;persist();syncPagers(p)}},120);
  },{passive:true})});
  const target=scrollToVerse&&feed.querySelector(`.verse[data-v="${scrollToVerse}"]`);
  feed.scrollTop=target?target.offsetTop:0;
}

function syncPagers(except){
  document.querySelectorAll('.pager').forEach(p=>{if(p===except)return;p._sync=true;p.scrollLeft=S.panel*p.clientWidth;
    p.parentElement.querySelectorAll('.tabs button').forEach((d,j)=>d.setAttribute('aria-selected',j===S.panel));
    requestAnimationFrame(()=>requestAnimationFrame(()=>p._sync=false))});
}
function currentVerse(){const f=$('#feed');const i=Math.round(f.scrollTop/f.clientHeight);const card=f.children[i];return card&&card.classList.contains('verse')?card:null}
function verseData(card){return S.cache[S.ch].find(x=>x.v==card.dataset.v)}
function setHash(){const v=currentVerse();const h='#c'+S.ch+(v?'-v'+v.dataset.v:'');if(location.hash!==h)try{history.replaceState(null,'',h)}catch(e){}}

function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;$('#scrim').hidden=false;$('#sheet').scrollTop=0;$('#sheetClose').focus()}
function closeSheet(){$('#sheet').hidden=true;$('#scrim').hidden=true}
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}

async function share(card){
  const v=verseData(card),key=card.dataset.key,x=vx(S.chapters[S.ch-1],v);
  const body=S.panel===1&&x.short?x.short:x.tr;
  const text=`${v.sa}\n\n${body}\n\nBhagavad Gita ${key}`;
  try{await navigator.clipboard.writeText(text);toast(t('copied'))}
  catch(e){openSheet(t('share'),`<p style="user-select:all">${esc(text)}</p>`)}
}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){const p=tb.closest('.card').querySelector('.pager');p.scrollTo({left:+tb.dataset.tab*p.clientWidth,behavior:'smooth'});return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act, card=b.closest('.card');
  const c=S.chapters[S.ch-1];
  if(act==='faq'){const f=card.dataset.key?vx(c,verseData(card)).faq:cx(c).faq;openSheet(`${t('faq')} · ${card.dataset.key||`${t('chapter')} ${c.n}`}`,faqHTML(f));if(b.dataset.q){const dt=$('#sheetBody').querySelectorAll('dt')[+b.dataset.q];if(dt)dt.scrollIntoView({block:'start'})}}
  else if(act==='share')share(card);
  else if(act==='save'){const k=card.dataset.key;S.saved.has(k)?S.saved.delete(k):S.saved.add(k);b.classList.toggle('on');b.setAttribute('aria-pressed',S.saved.has(k));persist()}
  else if(act==='next'){S.ch++;render().then(setHash)}
});
$('#chapBtn').onclick=()=>openSheet(t('chooseCh'),`<div class="ch-list">${S.chapters.map(c=>{const x=cx(c);return `<button data-ch="${c.n}" aria-current="${c.n===S.ch}"><span class="n">${c.n}</span><span class="t"><span>${esc(x.name)}</span><small>${S.lang==='ar'?'':esc(x.mean)+' · '}${c.count} ${t('verses')}</small></span></button>`}).join('')}</div>`);
$('#langBtn').onclick=()=>openSheet(t('lang'),`<div class="lang-list">${LANGS.map(([k,name,short])=>`<button data-lang="${k}" lang="${k}" aria-current="${k===S.lang}"><span>${name}</span><small>${short}</small></button>`).join('')}</div>`);
$('#sheetBody').addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g){const [c,v]=g.dataset.goto.split('-').map(Number);if(c<1||c>18)return;closeSheet();S.ch=c;render(v).then(setHash);return}
  const l=e.target.closest('[data-lang]');if(l){closeSheet();if(l.dataset.lang!==S.lang){S.lang=l.dataset.lang;rerenderKeepingPlace()}return}
  const b=e.target.closest('[data-ch]');if(!b)return;S.ch=+b.dataset.ch;closeSheet();render().then(setHash)});
const faqHTML=items=>`<dl class="faq">${items.map(x=>`<dt>${esc(x.q)}</dt><dd>${withCites(x.a)}</dd>`).join('')}</dl>`;
$('#sheetClose').onclick=closeSheet;$('#scrim').onclick=()=>{closeSheet();closeAsk()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeAsk()}});

/* Ask Gita */
const ASK_T={
  en:{btn:'Ask',title:'Ask Gita',ph:'Ask about life or any verse…',send:'Ask',wait:'Looking through the Gita…',err:'Couldn\'t reach Ask Gita. Check your connection and try again.',
    intro:'Ask about stress, anger, purpose, relationships or any verse. Answers come from the Gita, with the verses they use.',
    sugg:['How do I stop overthinking results?','What does the Gita say about anger?','How do I find my purpose?','Explain verse 2.47 simply']},
  hi:{btn:'पूछें',title:'गीता से पूछें',ph:'ज़िंदगी या किसी श्लोक के बारे में पूछें…',send:'पूछें',wait:'गीता में देख रहे हैं…',err:'गीता से जवाब नहीं मिल पाया। कनेक्शन देखें और फिर कोशिश करें।',
    intro:'तनाव, गुस्सा, जीवन का उद्देश्य, रिश्ते या किसी भी श्लोक के बारे में पूछें। जवाब गीता से आते हैं, साथ में श्लोक भी।',

  fr:{gateH:'Inscris-toi pour demander à la Gita',gate:'Lire Gita4U est gratuit et sans compte. Pour poser tes propres questions à la Gita, inscris-toi avec ton e-mail. Tes {n} premières questions sont gratuites.',emailPh:'toi@exemple.com',sendCode:'Envoyer le code',codeSent:'Nous avons envoyé un code à 6 chiffres à {email}. Il peut mettre une minute à arriver.',codePh:'Code à 6 chiffres',verify:'Valider',otherEmail:'Utiliser un autre e-mail',badEmail:'Saisis une adresse e-mail valide.',badCode:'Ce code n\'a pas marché. Vérifie-le ou demande-en un nouveau.',freeLeft:'{n} questions gratuites restantes',free1:'1 question gratuite restante',paidLeft:'{n} questions restantes, jusqu\'au {date}',signOut:'Se déconnecter',outH:'Tu as utilisé tes questions gratuites',out:'Obtiens {q} questions de plus pour {price}. Elles durent {d} jours. La lecture reste gratuite.',pay:'Payer {price}',paid:'Paiement reçu. À toi de demander !',payErr:'Le paiement n\'est pas passé. Rien ne t\'a été facturé pour un paiement échoué.',noSetup:'La connexion n\'est pas encore configurée sur cette version du site.',wait:'Un instant…'},
  es:{gateH:'Regístrate para preguntarle a la Gita',gate:'Leer Gita4U es gratis y no necesita cuenta. Para hacerle tus propias preguntas a la Gita, regístrate con tu correo. Tus primeras {n} preguntas son gratis.',emailPh:'tu@ejemplo.com',sendCode:'Enviar código',codeSent:'Enviamos un código de 6 dígitos a {email}. Puede tardar un minuto en llegar.',codePh:'Código de 6 dígitos',verify:'Verificar',otherEmail:'Usar otro correo',badEmail:'Escribe un correo válido.',badCode:'Ese código no funcionó. Revísalo o pide uno nuevo.',freeLeft:'Te quedan {n} preguntas gratis',free1:'Te queda 1 pregunta gratis',paidLeft:'Te quedan {n} preguntas, hasta el {date}',signOut:'Cerrar sesión',outH:'Ya usaste tus preguntas gratis',out:'Consigue {q} preguntas más por {price}. Duran {d} días. Leer sigue siendo gratis.',pay:'Pagar {price}',paid:'Pago recibido. ¡Pregunta lo que quieras!',payErr:'El pago no se completó. No se te cobró nada por un pago fallido.',noSetup:'El inicio de sesión aún no está configurado en esta versión del sitio.',wait:'Un momento…'},
  ar:{gateH:'سجّل لتسأل الغيتا',gate:'قراءة Gita4U مجانية ولا تحتاج إلى حساب. لتطرح أسئلتك على الغيتا، سجّل ببريدك الإلكتروني. أول {n} أسئلة مجانية.',emailPh:'you@example.com',sendCode:'أرسل الرمز',codeSent:'أرسلنا رمزًا من 6 أرقام إلى {email}. قد يستغرق وصوله دقيقة.',codePh:'رمز من 6 أرقام',verify:'تحقّق',otherEmail:'استخدم بريدًا آخر',badEmail:'أدخل بريدًا إلكترونيًا صحيحًا.',badCode:'هذا الرمز لم ينجح. تحقّق منه أو اطلب رمزًا جديدًا.',freeLeft:'بقي لك {n} أسئلة مجانية',free1:'بقي لك سؤال مجاني واحد',paidLeft:'بقي لك {n} سؤالًا حتى {date}',signOut:'تسجيل الخروج',outH:'استخدمت أسئلتك المجانية',out:'احصل على {q} سؤالًا إضافيًا مقابل {price}. صالحة لمدة {d} يومًا. القراءة تبقى مجانية.',pay:'ادفع {price}',paid:'تم استلام الدفع. اسأل ما تشاء!',payErr:'لم تكتمل عملية الدفع. لم يُخصم منك شيء مقابل دفعة فاشلة.',noSetup:'تسجيل الدخول غير مُعدّ بعد في هذه النسخة من الموقع.',wait:'لحظة…'}
};
const ac=(k,vars={})=>ACC_T[S.lang][k].replace(/\{(\w+)\}/g,(m,x)=>vars[x]??m);
const FREE_Q=3;
let auth=null,acct=null,gate={step:'email',email:'',err:''};
try{auth=JSON.parse(localStorage.getItem('gita-auth')||'null')}catch(e){}
function saveAuth(a){auth=a;if(!a)acct=null;try{a?localStorage.setItem('gita-auth',JSON.stringify(a)):localStorage.removeItem('gita-auth')}catch(e){}}
async function sbAuth(path,body){
  if(!CFG.supabaseUrl||!CFG.supabaseKey)throw new Error(ac('noSetup'));
  const r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseKey},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(d.msg||d.error_description||d.message||at('err')),{status:r.status});
  return d;
}
function keepSession(d){saveAuth({access:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,email:(d.user&&d.user.email)||(auth&&auth.email)||gate.email})}
async function accessToken(){
  if(!auth)return null;
  if(Date.now()>auth.exp-60000){
    try{keepSession(await sbAuth('token?grant_type=refresh_token',{refresh_token:auth.refresh}))}
    catch(e){if(e.status>=400&&e.status<500)saveAuth(null);return null}
  }
  return auth&&auth.access;
}
async function api(path,init={}){
  const tk=await accessToken();
  const r=await fetch(path,{...init,headers:{'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})}});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&d.needLogin){saveAuth(null);gate={step:'email',email:'',err:''}}
  return {r,d};
}
const money=p=>{try{return new Intl.NumberFormat(S.lang==='hi'?'hi-IN':S.lang,{style:'currency',currency:p.currency,maximumFractionDigits:p.price%100?2:0}).format(p.price/100)}catch(e){return (p.price/100)+' '+p.currency}};
const day=iso=>{try{return new Date(iso).toLocaleDateString(S.lang==='hi'?'hi-IN':S.lang,{day:'numeric',month:'short'})}catch(e){return iso.slice(0,10)}};
const outOfQuestions=()=>acct&&acct.freeLeft<=0&&acct.paidLeft<=0;
function renderAccount(){
  const st=$('#askStatus'),g=$('#askGate'),form=$('#askForm');
  if(!auth){
    st.hidden=true;form.hidden=true;g.hidden=false;
    g.innerHTML=gate.step==='email'
      ?`<h3>${esc(ac('gateH'))}</h3><p>${esc(ac('gate',{n:FREE_Q}))}</p>
        <form data-gate="email"><input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="${esc(ac('emailPh'))}" value="${esc(gate.email)}" aria-label="Email"><button class="big-btn">${esc(ac('sendCode'))}</button></form>`
      :`<h3>${esc(ac('gateH'))}</h3><p>${esc(ac('codeSent',{email:gate.email}))}</p>
        <form data-gate="code"><input class="code" name="code" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10" placeholder="${esc(ac('codePh'))}" aria-label="${esc(ac('codePh'))}"><button class="big-btn">${esc(ac('verify'))}</button></form>
        <button class="link" data-gate-back>${esc(ac('otherEmail'))}</button>`;
    if(gate.err)g.insertAdjacentHTML('beforeend',`<p class="err" role="alert">${esc(gate.err)}</p>`);
    return;
  }
  st.hidden=false;
  const left=!acct?'':acct.paidLeft>0?ac('paidLeft',{n:acct.paidLeft+acct.freeLeft,date:day(acct.paidUntil)}):acct.freeLeft===1?ac('free1'):ac('freeLeft',{n:acct.freeLeft});
  st.innerHTML=`<span>${esc(left)}</span><span>${esc(auth.email||'')} · <button data-signout>${esc(ac('signOut'))}</button></span>`;
  if(outOfQuestions()){
    const p=acct.pack;form.hidden=true;g.hidden=false;
    g.innerHTML=`<h3>${esc(ac('outH'))}</h3><p>${esc(ac('out',{q:p.questions,price:money(p),d:p.days}))}</p><button class="big-btn" data-buy>${esc(ac('pay',{price:money(p)}))}</button>`;
    if(gate.err)g.insertAdjacentHTML('beforeend',`<p class="err" role="alert">${esc(gate.err)}</p>`);
  }else{g.hidden=true;form.hidden=false}
}
async function refreshAccount(){if(!auth)return;const {r,d}=await api('/api/account');if(r.ok)acct=d;renderAccount()}
$('#askGate').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector('button');btn.disabled=true;gate.err='';
  try{
    if(f.dataset.gate==='email'){
      const email=f.email.value.trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw new Error(ac('badEmail'));
      gate.email=email;await sbAuth('otp',{email,create_user:true});gate.step='code';
    }else{
      try{keepSession(await sbAuth('verify',{type:'email',email:gate.email,token:f.code.value.trim()}))}
      catch(x){throw new Error(x.message===ac('noSetup')?x.message:ac('badCode'))}
      gate={step:'email',email:'',err:''};await refreshAccount();
    }
  }catch(x){gate.err=x.message||at('err')}
  renderAccount();const i=$('#askGate input')||$('#askInput');if(i)i.focus();
});
$('#askGate').addEventListener('click',e=>{
  if(e.target.closest('[data-gate-back]')){gate={step:'email',email:gate.email,err:''};renderAccount();return}
  if(e.target.closest('[data-buy]'))buy(e.target.closest('[data-buy]'));
});
$('#askStatus').addEventListener('click',e=>{
  if(!e.target.closest('[data-signout]'))return;
  const tk=auth&&auth.access;
  if(tk&&CFG.supabaseUrl)fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/auth/v1/logout',{method:'POST',headers:{apikey:CFG.supabaseKey,Authorization:'Bearer '+tk}}).catch(()=>{});
  saveAuth(null);gate={step:'email',email:'',err:''};renderAccount();
});
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`)&&window.Razorpay)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error(at('err')));document.head.appendChild(s)})}
async function buy(btn){
  btn.disabled=true;btn.textContent=ac('wait');gate.err='';
  try{
    const {r,d}=await api('/api/pay',{method:'POST',body:JSON.stringify({action:'order'})});
    if(!r.ok)throw new Error(d.error||at('err'));
    await loadScript('https://checkout.razorpay.com/v1/checkout.js');
    const rz=new window.Razorpay({key:d.keyId,order_id:d.orderId,amount:d.amount,currency:d.currency,name:'Gita4U',
      description:ac('out',{q:acct.pack.questions,price:money(acct.pack),d:acct.pack.days}).split('.')[0],prefill:{email:d.email},theme:{color:'#f3a93b'},
      modal:{ondismiss:()=>renderAccount()},
      handler:async resp=>{
        const v=await api('/api/pay',{method:'POST',body:JSON.stringify({action:'verify',...resp})});
        if(v.r.ok){acct=v.d;gate.err='';renderAccount();toast(ac('paid'));$('#askInput').focus()}
        else{gate.err=v.d.error||ac('payErr');renderAccount()}
      }});
    rz.on('payment.failed',()=>{gate.err=ac('payErr');renderAccount()});
    rz.open();
  }catch(x){gate.err=x.message||ac('payErr');renderAccount()}
}

const at=k=>ASK_T[S.lang][k];
let askHistory=[];
function syncAsk(){$('#askBtnLabel').textContent=at('btn');$('#askTitle').textContent=at('title');$('#askInput').placeholder=at('ph');$('#askSend').textContent=at('send');if(!$('#ask').hidden)renderAccount()}
function askIntro(){$('#askLog').innerHTML=`<p class="intro">${esc(at('intro'))}</p>`+(auth?`<div class="chips">${at('sugg').map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:'')}
function openAsk(){closeSheet();syncAsk();if(!askHistory.length)askIntro();renderAccount();$('#ask').hidden=false;$('#scrim').hidden=false;refreshAccount().then(()=>{if(!askHistory.length)askIntro()});const i=$('#askGate:not([hidden]) input')||$('#askInput');i.focus()}
function closeAsk(){if($('#ask').hidden)return;$('#ask').hidden=true;if($('#sheet').hidden)$('#scrim').hidden=true}
function addMsg(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;const log=$('#askLog');log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
const withCites=text=>esc(text).replace(/\[(\d{1,2})\.(\d{1,2})\]/g,(m,c,v)=>`<button class="cite" data-goto="${c}-${v}">${c}.${v}</button>`);
async function ask(q){
  q=q.trim();if(!q)return;
  if(!auth||outOfQuestions()){renderAccount();return}
  if(!askHistory.length)$('#askLog').innerHTML='';
  addMsg('me',esc(q));
  const wait=addMsg('gita wait',esc(at('wait')));
  $('#askSend').disabled=true;$('#askInput').value='';
  try{
    const {r,d:data}=await api('/api/ask',{method:'POST',body:JSON.stringify({question:q,lang:S.lang,history:askHistory})});
    if(r.status===402&&data.account){acct=data.account;$('#askInput').value=q;wait.remove();return}
    if(r.status===401&&data.needLogin){$('#askInput').value=q;wait.remove();return}
    if(!r.ok||!data.answer)throw new Error(data.error||at('err'));
    wait.className='msg gita';wait.innerHTML=withCites(data.answer);
    if(data.account)acct=data.account;
    askHistory.push({role:'user',content:q},{role:'assistant',content:data.answer});
  }catch(e){wait.className='msg gita err';wait.textContent=e.message||at('err')}
  finally{$('#askSend').disabled=false;renderAccount();$('#askLog').scrollTop=$('#askLog').scrollHeight}
}
$('#askBtn').onclick=openAsk;$('#askClose').onclick=closeAsk;
$('#askForm').addEventListener('submit',e=>{e.preventDefault();ask($('#askInput').value)});
$('#askLog').addEventListener('click',e=>{
  const chip=e.target.closest('[data-q]');if(chip){ask(chip.dataset.q);return}
  const g=e.target.closest('[data-goto]');if(!g)return;
  const [c,v]=g.dataset.goto.split('-').map(Number);if(c<1||c>18)return;
  closeAsk();S.ch=c;render(v).then(setHash);
});
function syncToggles(){
  $('#langLabel').textContent=LANGS.find(l=>l[0]===S.lang)[2];
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
}
function rerenderKeepingPlace(){const v=currentVerse();askHistory=[];syncToggles();syncAsk();persist();render(v&&v.dataset.v)}
let st;$('#feed').addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(setHash,150)},{passive:true});

function fromHash(){const m=/^#c(\d+)(?:-v(\d+))?$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=18){S.ch=+m[1];return m[2]}return null}
window.addEventListener('resize',()=>syncPagers(null));
window.addEventListener('hashchange',()=>{closeSheet();const v=fromHash();render(v)});
(async()=>{
  syncToggles();syncAsk();
  try{S.chapters=await getJSON('data/chapters.json')}catch(e){$('#feed').innerHTML='<div class="loading">Could not load the Gita. Check your connection and reopen the page.</div>';return}
  const v=fromHash();
  if(!location.hash)showLanding();
  await render(v);
})();
/* landing scroll: shown when the site opens without a verse link */
function showLanding(){$('#landing').hidden=false;syncLanding()}
function syncLanding(){
  $('#landCta span').textContent=t('tap');
  $('#landMeta').textContent=t('meta');
  $('#landVerseH').textContent=t('sVerse');$('#landShortsH').textContent=t('shorts');
  $('#landVerse').textContent=t('landVerse');$('#landShorts').textContent=t('landShorts');$('#landNote').textContent=t('landNote');
  $('#landLangs').innerHTML=LANGS.map(([k,name,short])=>`<button data-land-lang="${k}" lang="${k}" aria-label="${name}" aria-pressed="${k===S.lang}">${short}</button>`).join('');
}
$('#landLangs').addEventListener('click',e=>{
  const b=e.target.closest('[data-land-lang]');if(!b||b.dataset.landLang===S.lang)return;
  S.lang=b.dataset.landLang;syncLanding();rerenderKeepingPlace();
});
$('#scroll').onclick=()=>{
  const l=$('#landing');if(l.classList.contains('opening'))return;
  l.classList.add('opening');$('#scroll').classList.add('open');
  const quick=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    if(S.ch!==1){S.ch=1;render(null)}else $('#feed').scrollTop=0;
    l.classList.add('gone');setHash();
    setTimeout(()=>{l.hidden=true;l.classList.remove('opening','gone');$('#scroll').classList.remove('open')},quick?0:500);
  },quick?0:1500);
};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
